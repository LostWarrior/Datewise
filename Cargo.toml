[package]
name = "datewise"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
description = "Small, panic-free parser for English date and time phrases with time zone and DST handling"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/LostWarrior/Datewise"
keywords = ["date", "time", "parser", "natural-language", "timezone"]
categories = ["date-and-time", "parser-implementations"]
include = ["src/**/*.rs", "tests/**/*.rs", "README.md", "CHANGELOG.md", "LICENSE-APACHE"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
